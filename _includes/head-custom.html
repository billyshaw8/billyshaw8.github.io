<link rel="stylesheet" href="{{ '/assets/css/dark-mode.css' | relative_url }}?v=4">
<style>
  #theme-toggle {
    position: fixed !important;
    top: 16px !important;
    right: 16px !important;
    z-index: 2147483647 !important;
    display: grid !important;
    width: 44px !important;
    height: 44px !important;
    place-items: center !important;
    padding: 0 !important;
    border: 1px solid #777 !important;
    border-radius: 50% !important;
    background: #fff !important;
    color: #222 !important;
    cursor: pointer !important;
    -webkit-appearance: none !important;
    appearance: none !important;
  }
  #theme-toggle svg {
    display: block !important;
    width: 24px !important;
    height: 24px !important;
    fill: none !important;
    stroke: currentColor !important;
    stroke-width: 2 !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
  }
  html[data-theme="dark"] #theme-toggle {
    background: #22262b !important;
    color: #fff !important;
  }
</style>
<script>
(function () {
  var key = 'billyshaw8-theme';
  var root = document.documentElement;

  function savedTheme() {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function setTheme(theme) {
    var dark = theme === 'dark';
    root.setAttribute('data-theme', dark ? 'dark' : 'light');
    var button = document.getElementById('theme-toggle');
    if (!button) return;
    button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    button.setAttribute('aria-pressed', dark ? 'true' : 'false');
    button.innerHTML = dark
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>';
  }

  var preference = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
  setTheme(savedTheme() || (preference && preference.matches ? 'dark' : 'light'));

  function addButton() {
    if (document.getElementById('theme-toggle') || !document.body) return;
    var button = document.createElement('button');
    button.id = 'theme-toggle';
    button.type = 'button';
    button.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem(key, next); } catch (e) {}
    });
    document.body.appendChild(button);
    setTheme(root.getAttribute('data-theme'));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addButton);
  } else {
    addButton();
  }
})();
</script>
<script src="{{ '/assets/js/dark-mode.js' | relative_url }}?v=4" defer></script>
